<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Plataforma do Naksy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0a1f14;
    color: #fff;
}

.container {
    max-width: 400px;
    margin: 60px auto;
    background: #0f2d1f;
    padding: 20px;
    border-radius: 10px;
}

h2 {
    text-align: center;
    color: #3cff9a;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;
    font-size: 15px;
}

input {
    background: #163b2a;
    color: #fff;
}

button {
    background: #3cff9a;
    color: #000;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.hidden {
    display: none;
}

.info {
    background: #163b2a;
    padding: 10px;
    margin-top: 15px;
    border-radius: 6px;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container" id="login">
    <h2>Entrar</h2>
    <input id="loginUser" placeholder="Usuário">
    <input id="loginPass" type="password" placeholder="Senha">
    <button onclick="entrar()">Entrar</button>
    <button onclick="mostrarCadastro()">Cadastro</button>
</div>

<div class="container hidden" id="cadastro">
    <h2>Cadastro</h2>
    <input id="cadUser" placeholder="Usuário">
    <input id="cadPass" type="password" placeholder="Senha">
    <button onclick="cadastrar()">Cadastrar</button>
    <button onclick="voltarLogin()">Voltar</button>
</div>

<div class="container hidden" id="painel">
    <h2>Plataforma de Apostas</h2>
    <p>Bem-vindo, <span id="usuarioLogado"></span></p>

    <button onclick="mostrarDeposito()">Depositar</button>
    <button onclick="sair()">Sair</button>

    <div class="info hidden" id="deposito">
        <h3>Depósito via PIX (DEMO)</h3>
        <p><strong>Chave PIX:</strong></p>
        <input value="SUA_CHAVE_PIX_AQUI" readonly>
        <p>
            Após realizar o PIX, o saldo será creditado
            <strong>manualmente</strong> (simulação).
        </p>
        <p style="color:#ffcc00;">
            ⚠️ Esta é uma simulação. Nenhum pagamento real é processado.
        </p>
    </div>
</div>

<script>
function cadastrar() {
    const user = cadUser.value;
    const pass = cadPass.value;

    if (!user || !pass) {
        alert("Preencha todos os campos");
        return;
    }

    localStorage.setItem("user", user);
    localStorage.setItem("pass", pass);

    alert("Cadastro realizado com sucesso!");
    voltarLogin();
}

function entrar() {
    const user = loginUser.value;
    const pass = loginPass.value;

    if (
        user === localStorage.getItem("user") &&
        pass === localStorage.getItem("pass")
    ) {
        login.classList.add("hidden");
        painel.classList.remove("hidden");
        usuarioLogado.innerText = user;
    } else {
        alert("Usuário ou senha inválidos");
    }
}

function mostrarCadastro() {
    login.classList.add("hidden");
    cadastro.classList.remove("hidden");
}

function voltarLogin() {
    cadastro.classList.add("hidden");
    login.classList.remove("hidden");
}

function mostrarDeposito() {
    deposito.classList.toggle("hidden");
}

function sair() {
    painel.classList.add("hidden");
    login.classList.remove("hidden");
}
</script>

</body>
</html>
